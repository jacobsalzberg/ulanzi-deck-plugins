<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>San Francisco PT Clock Plugin</title>
  <style>
    html,
    body {
      font-family: 'Source Han Sans SC', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .status {
      padding: 20px;
      border-radius: 8px;
      background: #333;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="status">
    <h1>Ulanzi PT Clock Service</h1>
    <p>Keep this window open for the clock to update on your deck.</p>
    <div id="current-pt-time" style="font-size: 2em; font-weight: bold; margin-top: 10px;">--:--:--</div>
  </div>

  <!-- UlanziDeck Common Library References -->
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>

  <!-- Plugin JavaScript Modules -->
  <script src="./actions/ClockDisplay.js"></script>

  <!-- Main Service Logic -->
  <script src="./app.js"></script>
  
</body>
</html>
